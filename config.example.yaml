# Copy to config.yaml (gitignored) and edit. Every key is optional; values shown are defaults.
# Relative paths resolve against this file's directory. API keys never go here: use .env.

runs_dir: runs
presets_dir: presets
default_preset: cinematic_future_bass

claude_model: claude-sonnet-5-5   # claude-opus-5-5 for harder picks; per run: select --model
claude_effort: high               # low | medium | high | xhigh | max
claude_max_tokens: 16000
claude_fallbacks: true            # if Claude declines, the API retries on a recommended model
music_model: music_v2_5           # music_v2 | music_v2_5 (composition-plan chunks need v2+)
music_backend: stub               # stub | elevenlabs; per run: --music-backend
music_takes: 2                    # takes per generation; pick one with generate --take N

transcribe_backend: whisper
whisper_model: large-v3-turbo     # e.g. small for speed; per run: --whisper-model
language: null                    # null = detect; per run: --language en
soundfont: null                   # General MIDI .sf2; null = /usr/share/sounds/sf2/FluidR3_GM.sf2 etc.

whisper:
  device: auto                    # auto | cpu | cuda
  compute_type: auto              # auto = int8 on CPU, float16 on CUDA
  beam_size: 5
  vad_filter: true
  batch_size: 8                   # batched inference; 0 = sequential (2.2x slower on CPU)
  cpu_threads: 0                  # 0 = number of physical cores
  condition_on_previous_text: true
  repair_gaps: true               # re-transcribe word gaps that contain speech
  repair_min_gap_s: 3.0
  repair_min_speech_s: 1.5

demucs:                           # used by --isolate-voice (needs: uv sync --extra isolate)
  model: htdemucs
  device: cpu
  shifts: 0
  overlap: 0.25
  window_s: 120                   # processed in windows to bound memory
  context_s: 5
  crossfade_s: 0.5
  jobs: 0

align:
  fuzzy_threshold: 0.6            # min similarity for a fuzzy word match
  unspoken_min_tokens: 3          # unmatched official runs this long are "unspoken"
  unspoken_line_ratio: 0.25       # lines with fewer matched tokens are "unspoken"
  asr_sentence_min_words: 4       # ASR-only runs this long become their own sentence
  pause_split_s: 1.5
  max_sentence_s: 30
  min_coverage: 0.2               # below this the official transcript is ignored

elevenlabs:                       # Eleven Music API (needs ELEVENLABS_API_KEY in .env)
  output_format: auto             # auto = mp3_48000_192 for v2 models; pcm_44100 needs Pro+
  timeout_s: 900                  # paid calls are never retried automatically
  context_adherence: high         # low | medium | high: how closely chunks follow neighbours
  melody_reference: false         # condition the song on 04_melody_reference.wav (paid upload)
  condition_strength: low         # low | medium | high | xhigh (with melody_reference)

# Prices change. Claude list prices (as of 2026-09-25) and the Eleven Music API rate
# ($0.15/minute, as of 2026-10-01) are built in; entries here override them.
pricing:
  anthropic: {}
  #  claude-sonnet-5-5: {input_usd_per_mtok: 2.0, output_usd_per_mtok: 10.0, cache_read_usd_per_mtok: 0.2, as_of: "2026-09-25"}
  elevenlabs: {}
  #  music: {unit: minute, usd_per_unit: 0.15, as_of: "2026-10-01"}
