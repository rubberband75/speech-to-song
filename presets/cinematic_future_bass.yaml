# Style preset: cinematic future bass / midtempo bass with ambient + psychedelic elements
# Derived from a written description of the reference track (not from listening to it).
# Tempo/key values are starting points; the pipeline verifies output with librosa.

name: cinematic_future_bass
description: >
  Meditative spoken word over spacious ambient electronica that builds into
  warm, rubbery half-time bass drops, then recedes to give the speech room.

tempo:
  bpm: 114            # starting point; treat as adjustable
  feel: half-time     # heavy sections feel like ~57 BPM
  tolerance_bpm: 6    # re-generate or time-adjust if analysis lands outside this

key:
  mode: minor
  tonic: auto         # auto = use key detected from the extracted speech melody
  fallback: C

# Global style words sent to the music generator (the first chunk, which sets the tone of
# the whole song): genre, palette and mood. Density (drums, bass, leads) belongs to the
# sections that have it, so the quiet sections can stay quiet. (Words like "near-empty"
# or "negative space" gave beds the model left near-silent, for seconds on end.)
positive_styles:
  - cinematic psychedelic electronic
  - melodic future bass
  - midtempo bass
  - ambient electronica
  - lush wide synth chords
  - granular textures, reversed sounds, pitch bends, ear candy
  - instrumental
  - dynamic arrangement, soft pad-led quiet passages and huge drops
  - bittersweet, awe-filled, polished, spacious, immersive

negative_styles:
  - aggressive dubstep growls
  - riddim
  - harsh or metallic bass
  - busy arpeggios or leads during narration
  - sung vocals or lyrics
  - long silences

# Section roles. The arrangement builder maps each speech clip onto the timeline,
# then picks section roles around it. "energy" is 0-1 and guides density. "bars" is the
# section length (default 8; a speech_bed is fitted to its clip). "shape" is flat, rise
# (builds into the next section) or fall (fades out). "silent" sections get no music of
# their own (nothing is generated for them); the mix turns them into a short lift.
# "negative_styles" are what a section must leave out (the music model fills silence
# unless told not to). When a role appears more than once, its first and last
# occurrence add "first_styles" and "last_styles", so the song develops.
section_roles:
  intro:
    energy: 0.15
    bars: 8
    styles: [spacious ambient pads, soft granular textures, distant reversed sounds, filtered noise, sparse bell fragments]
    negative_styles: [drums, heavy bass]
  speech_bed:           # plays under a spoken clip (and drops out for a lone last phrase)
    energy: 0.2
    styles: [warm sustained pads, soft but always present, slow gentle chord changes, calm]
    negative_styles: [drums, percussion, beat, bassline, sub-bass, lead melody, arpeggios, busy, build-up, risers, silence]
  build:
    energy: 0.6
    bars: 8
    shape: rise
    styles: [rising synths, filtered percussion, pitch sweeps, reverse swells, increasing stereo width and reverb]
    last_styles: [the biggest build of the song]
  gap:                  # a bar before a drop: the build's tail and a swell into the drop
    energy: 0.0
    bars: 1
    silent: true
  drop:
    energy: 1.0
    bars: 16
    styles: [huge warm sub-bass, rounded elastic wobbling bass synth, punchy half-time drums, wide snare, trap-influenced hats, shimmering euphoric chords]
    first_styles: [restrained first drop, filtered lead, leaves room to grow]
    last_styles: [final drop and climax of the song, fullest and widest arrangement, soaring bright euphoric lead melody]
  breakdown:
    energy: 0.3
    bars: 8
    styles: [introspective, soft chords, gentle melodic motif]
    negative_styles: [heavy drums, sub drop]
  outro:
    energy: 0.1
    bars: 8
    shape: fall
    styles: [peaceful atmospheric resolution, warm pads settling]
    negative_styles: [drums, build-up]

# How the song's music ends, unless Claude's arc chooses: held_chord (it comes home to the
# tonic and that chord is held and rings away), stop (it ends crisply on the tonic), or
# fade (it fades out by itself). The music model always fades out at the very end of a
# generation, so held chords and stops are generated past the end and cut on the last bar.
ending: held_chord

# Default arc, adapted to however many clips were selected: the clips (in play order)
# are shared out over the speech_bed slots. The last slot lets the closing line end the
# song over the outro.
arc: [intro, speech_bed, build, gap, drop, breakdown, speech_bed, build, gap, drop,
      speech_bed, outro]

# Which lines Claude picks (seconds are spoken words, first to last)
clips:
  count: 8                          # about this many quotes, give or take
  count_tolerance: 2                # this many, so together they summarize the talk
  min_seconds: 3
  max_seconds: 15                   # the usual longest quote...
  long_max_seconds: 40              # ...unless it is essential to the talk's spirit
  total_speech_seconds: 150
  part_seconds: 15                  # longer quotes play in parts, with music between

# Song lengths. `summary` is everything above (about 8 quotes, 4-6 minutes); the others
# have their own form, bars and quote targets. `seconds` is how long the song should last,
# its ending's ring included: its music sections are lengthened or shortened (0.5-2x, in
# whole bars) to fit. An arc entry may give its part's bars ("drop 16").
lengths:
  short:
    description: about a minute with one drop, the talk's heart in two to four short lines, usually an opening line and a closing line
    seconds: [61, 75]
    arc: [intro, speech_bed, build, gap, drop, speech_bed, outro]
    bars: {intro: 4, build: 4, drop: 8, outro: 4}
    clips: {count: 3, count_tolerance: 1, max_seconds: 12, long_max_seconds: 15, total_speech_seconds: 25}
  highlights:
    description: two to three and a half minutes with two drops, the talk's key moments from its opening premise to its conclusion
    seconds: [120, 210]
    arc: [intro, speech_bed, build, gap, drop, speech_bed, build 8, gap, drop 16, speech_bed, outro]
    bars: {intro: 4, build: 4, drop: 8, outro: 4}
    clips: {count: 5, count_tolerance: 2, max_seconds: 15, long_max_seconds: 25, total_speech_seconds: 90}

# How the arrangement reacts to speech
speech_interaction:
  music_recedes_during_clips: true
  swell_after_clip_end: true        # use the end of an idea as a launch into the next section
  align_clip_starts_to: bar         # bar | beat | free
  tail_beats: 2                     # beats after a clip's last word before the next section
  part_pause_beats: 4               # music between the parts of a long quote
  lead_in_beats: 4                  # a passage's quiet bed starts a bar before its first word

# Local mix settings (pedalboard)
mix:
  bed_margin_db: 16                 # under a passage the music sits this far under the speech
  sidechain_duck_db: -9             # (set once, at the passage's bar lines), coming down at
                                    # most this much; a bed that is already quiet is left alone
  speech_highpass_hz: 90
  speech_reverb_send: 0.12          # increase for the psychedelic sections
  speech_delay_send: 0.06
  target_lufs: -14
  speech_level_lu: 2                # speech loudness relative to the music's
  melody_layer_lu: -10              # melody layer loudness relative to the music's
  melody_under_speech_db: -6        # extra cut when the melody plays under speech
  energy_range_db: 20               # level from energy 0 to 1 when shaping the music (M7
                                    # beds are composed quiet: about 16 dB under the drops)
  energy_tolerance_db: 3            # deviations within this are left alone
  energy_max_db: 6                  # largest correction per section (0 = no shaping)...
  energy_max_boost_db: 12           # ...or lift, for a section the model made too quiet
  gap_swell: 0.8                    # a gap lifts into the drop: reverse swell of the build's
  gap_lift_db: 3                    # tail (level, 0 = none) and a rise of this much (dB)
  ring_out_s: 6                     # the last chord rings out this long, where the music
                                    # would stop abruptly (0 = as generated)
  alone_ring_s: 1.5                 # a passage played alone: the music rings away this long
                                    # before its last phrase, which lands in silence
  late_entry_max_bars: 4            # pull a drop that opens silent after a gap onto its
                                    # downbeat, if it is at most this late (0 = off)
  speech_margin_db: 10              # music stays this far under every word (speech band)

# Speech-to-melody settings
melody:
  quantize_grid: 1/8
  scale_snap_strength: 0.8          # 0 = raw speech contour, 1 = fully snapped to scale
  loop_phrase_count: 3              # repetition drives the speech-to-song illusion
  render_instrument: soft_piano     # rendered for the (optional, off) audio references
  layer: "off"                      # MIDI melody in the mix: off | replay (the line just
                                    # heard returns as the tune in layer_roles) | all
                                    # (also quietly under speech)
  layer_roles: [breakdown, drop]
